<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Articles - LearnHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div style="max-width: 1000px; margin: 0 auto; padding: 2rem;">

        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <a th:href="@{/admin}">Dashboard</a>
            <span class="separator">/</span>
            <span>Articles</span>
        </div>

        <div class="page-header">
            <h1>&#128221; Manage Articles</h1>
            <a th:href="@{/admin/articles/create}" class="btn btn-primary">+ New Article</a>
        </div>

        <!-- Flash Messages -->
        <div th:if="${success}" class="alert alert-success" th:text="${success}">Success</div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}">Error</div>

        <!-- Articles Table -->
        <div class="table-container">
            <table th:if="${!#lists.isEmpty(articles)}">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Topic</th>
                        <th>Category</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="article : ${articles}">
                        <td th:text="${article.id}">1</td>
                        <td>
                            <a th:href="@{/article/{id}(id=${article.id})}"
                               th:text="${article.title}" target="_blank">
                                Article Title
                            </a>
                        </td>
                        <td th:text="${article.topic.title}">Topic</td>
                        <td th:text="${article.topic.category.name}">Category</td>
                        <td th:text="${#temporals.format(article.createdAt, 'MMM dd, yyyy')}">
                            Jan 01, 2025
                        </td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/admin/articles/edit/{id}(id=${article.id})}"
                                   class="btn btn-primary btn-sm">Edit</a>
                                <form th:action="@{/admin/articles/delete/{id}(id=${article.id})}"
                                      method="post"
                                      onsubmit="return confirm('Are you sure you want to delete this article?');">
                                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <p th:if="${#lists.isEmpty(articles)}" style="text-align: center; color: var(--gray); padding: 2rem;">
                No articles yet.
                <a th:href="@{/admin/articles/create}">Create your first article!</a>
            </p>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

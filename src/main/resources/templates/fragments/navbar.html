<!-- Navbar Fragment
     This is included in every page using th:replace="~{fragments/navbar :: navbar}"
     Uses Thymeleaf Security extras for showing/hiding links based on role -->
<!-- Azubix Navbar -->
<!-- Azubix Navbar + Page Loader -->
<div th:fragment="navbar" class="navbar-wrapper"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <!-- Page Loader -->
    <div class="page-loader" id="pageLoader">
        <div class="loader-dots">
            <span></span><span></span><span></span>
        </div>
        <div class="loader-brand">AZUBIX</div>
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-inner">

            <!-- Brand -->
            <a th:href="@{/}" class="navbar-brand">
                <span class="brand-icon">Az</span>
                <span class="brand-text">Azubi<span class="brand-accent">x</span></span>
            </a>

            <!-- Centre links -->
            <div class="nav-links" id="navRight">
                <a th:href="@{/}"
                   class="nav-link"
                   th:classappend="${requestURI == '/'} ? ' active' : ''"
                   th:text="#{nav.home}">Home</a>

                <a th:href="@{/categories}"
                   class="nav-link"
                   th:classappend="${requestURI.startsWith('/categor')} ? ' active' : ''"
                   th:text="#{nav.courses}">Courses</a>

                <a th:href="@{/leaderboard}"
                   class="nav-link"
                   th:classappend="${requestURI.startsWith('/leaderboard')} ? ' active' : ''"
                   th:text="#{nav.leaderboard}">Leaderboard</a>

                <a th:href="@{/roadmaps}"
                   class="nav-link"
                   th:classappend="${requestURI.startsWith('/roadmaps')} ? ' active' : ''">Roadmaps</a>

                <a sec:authorize="isAuthenticated()"
                   th:href="@{/dashboard}"
                   class="nav-link"
                   th:classappend="${requestURI.startsWith('/dashboard')} ? ' active' : ''"
                   th:text="#{nav.myDashboard}">My Dashboard</a>

                <a sec:authorize="hasRole('ADMIN')"
                   th:href="@{/admin}"
                   class="nav-link"
                   th:classappend="${requestURI.startsWith('/admin')} ? ' active' : ''"
                   th:text="#{nav.dashboard}">Dashboard</a>
            </div>

            <!-- Right actions -->
            <div class="nav-right">

                <!-- Unauthenticated -->
                <a sec:authorize="!isAuthenticated()" th:href="@{/login}"
                   class="nav-signin" th:text="#{nav.signin}">Sign In</a>
                <a sec:authorize="!isAuthenticated()" th:href="@{/register}"
                   class="nav-cta" th:text="#{nav.getstarted}">Get Started</a>

                <!-- Authenticated: user pill + logout -->
                <div sec:authorize="isAuthenticated()" class="nav-user-group">
                    <a th:href="@{/profile}" class="user-pill">
                        <span class="user-avatar-bubble"
                              th:text="${currentUserEmail != null ? currentUserEmail.substring(0,1) : 'U'}">U</span>
                        <span class="user-email" th:text="${currentUserEmail}">user@email.com</span>
                    </a>
                    <form th:action="@{/logout}" method="post" style="margin:0;">
                        <button type="submit" class="nav-logout" th:text="#{nav.logout}">Logout</button>
                    </form>
                </div>

                <!-- Theme toggle -->
                <button class="nav-theme-btn" id="themeToggle" aria-label="Toggle theme">
                    <span class="theme-sun">&#9728;</span>
                    <span class="theme-moon">&#9790;</span>
                </button>

                <!-- Separator -->
                <div class="nav-sep"></div>

                <!-- Language Switcher -->
                <div class="nav-lang-dropdown">
                    <button class="nav-lang-btn"
                            onclick="var m=document.getElementById('langMenu'); m.classList.toggle('open');">
                        <span class="lang-globe">&#127760;</span>
                        <span th:text="${#locale.language == 'de' ? 'DE' : 'EN'}">EN</span>
                        <span class="lang-arrow">&#9662;</span>
                    </button>
                    <div class="nav-lang-menu" id="langMenu">
                        <a th:href="@{''(lang='en')}" class="lang-option"
                           th:classappend="${#locale.language == 'en'} ? 'active' : ''">
                            <span>&#127468;&#127463;</span>
                            <span th:text="#{lang.en}">English</span>
                        </a>
                        <a th:href="@{''(lang='de')}" class="lang-option"
                           th:classappend="${#locale.language == 'de'} ? 'active' : ''">
                            <span>&#127465;&#127466;</span>
                            <span th:text="#{lang.de}">Deutsch</span>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Mobile hamburger -->
            <button class="mobile-toggle"
                    onclick="document.getElementById('navRight').classList.toggle('open')"
                    aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>

        </div>
    </nav>

    <!-- Theme init: runs before paint to prevent flash of wrong theme -->
<script>
    (function() {
        var t = localStorage.getItem('azubix-theme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
</script>

    <!-- Loader + Theme toggle + Lang dropdown -->
<script>
    // ── Page loader ───────────────────────────────────────────
    var loaderStart = Date.now();
    window.addEventListener('load', function() {
        var elapsed = Date.now() - loaderStart;
        setTimeout(function() {
            var l = document.getElementById('pageLoader');
            if (l) l.classList.add('loaded');
        }, Math.max(300 - elapsed, 0));
    });

    document.addEventListener('click', function(e) {
        var link = e.target.closest('a');
        if (link && link.href && !link.href.startsWith('#') && !link.target) {
            var l = document.getElementById('pageLoader');
            if (l) l.classList.remove('loaded');
        }
    });

    // ── Theme toggle ──────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function() {
        var btn = document.getElementById('themeToggle');
        if (!btn) return;
        btn.addEventListener('click', function() {
            var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('azubix-theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('azubix-theme', 'dark');
            }
        });
    });

    // ── Language dropdown: close on outside click ─────────────
    document.addEventListener('click', function(e) {
        var dropdown = document.getElementById('langMenu');
        if (dropdown && !e.target.closest('.nav-lang-dropdown')) {
            dropdown.classList.remove('open');
        }
    });
</script>
</div>
